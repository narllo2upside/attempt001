<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말랑테스트 | 무료 심리 테스트 모음 - 성격·연애·MBTI·운세</title>
<meta name="description" content="회원가입 없이 바로 결과를 보는 무료 심리 테스트 모음. 성격, 연애, MBTI, 운세, 능력 테스트를 즐겨 보세요.">
<link rel="canonical" href="https://YOUR-DOMAIN.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="말랑테스트 | 무료 심리 테스트 모음">
<meta property="og:description" content="회원가입 없이 바로 결과를 보는 무료 심리 테스트 모음.">
<meta property="og:image" content="https://YOUR-DOMAIN.com/og-home.png">
<meta name="twitter:card" content="summary_large_image">
<!-- AdSense 사이트 소유 확인용: 승인 신청 시 주석 해제 후 pub ID 입력 -->
<!-- <meta name="google-adsense-account" content="ca-pub-XXXXXXXXXXXXXXXX"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/config.js"></script>
</head>
<body>
<div id="site-header"></div>

<main id="main-content" class="wrap wrap--wide">
  <section class="home-hero">
    <h1>심심할 때 하나씩, 말랑한 테스트</h1>
    <p>성격, 연애, MBTI, 운세까지. 회원가입 없이 바로 결과를 볼 수 있어요.</p>
    <form class="search" role="search" id="search-form">
      <input type="search" id="search" placeholder="테스트 이름으로 찾기" aria-label="테스트 검색" autocomplete="off">
    </form>
  </section>

  <nav class="chips" id="cat-chips" aria-label="카테고리"></nav>

  <div data-ad="home_top"></div>

  <section id="tests">
    <h2 class="section-title" id="list-title">심리 테스트 목록</h2>
    <div class="card-grid card-grid--home" id="test-grid"></div>
    <nav class="pager" id="pager" aria-label="페이지"></nav>
  </section>

  <div data-ad="home_bottom"></div>
</main>

<div id="site-footer"></div>

<script src="assets/js/ads.js"></script>
<script src="assets/js/common.js"></script>
<script>
  (function () {
    var C = window.SITE_CONFIG;
    var cats = C.categories;
    var cur = Site.param('cat') || 'all';
    if (!cats.some(function (c) { return c.key === cur; })) cur = 'all';
    var page = Math.max(1, parseInt(Site.param('page'), 10) || 1);
    var grid = document.getElementById('test-grid');

    function href(cat, p) {
      var q = [];
      if (cat !== 'all') q.push('cat=' + cat);
      if (p > 1) q.push('page=' + p);
      return Site.url(q.length ? '?' + q.join('&') : '') + '#tests';
    }

    // 카테고리 칩과 페이지 번호는 모두 실제 링크 → 누를 때마다 페이지 이동(비네트 광고 기회)
    Site.loadTests().then(function (list) {
      document.getElementById('cat-chips').innerHTML = cats.map(function (c) {
        var n = c.key === 'all' ? list.length : list.filter(function (t) { return t.category === c.key; }).length;
        return '<a class="chip" href="' + href(c.key, 1) + '"' + (c.key === cur ? ' aria-current="page"' : '') + '>' +
          Site.esc(c.label) + ' <small>' + n + '</small></a>';
      }).join('');
    });

    document.getElementById('list-title').textContent = cur === 'all' ? '심리 테스트 목록' : Site.catLabel(cur) + ' 테스트';

    function render(query) {
      return Site.renderGrid(grid, {
        category: cur, query: query, page: page,
        pageSize: query ? 0 : C.pageSize, infeedEvery: C.infeedEvery, infeedSlot: 'home_infeed'
      }).then(function (info) {
        Site.pagination(document.getElementById('pager'), page, query ? 1 : info.pages, function (p) { return href(cur, p); });
      });
    }
    render('');

    // 검색은 목록만 다시 그림 (페이지 이동 없음)
    var t;
    document.getElementById('search').addEventListener('input', function (e) {
      clearTimeout(t);
      var v = e.target.value;
      t = setTimeout(function () { render(v); }, 150);
    });
    document.getElementById('search-form').addEventListener('submit', function (e) { e.preventDefault(); });
  })();
</script>
</body>
</html>
